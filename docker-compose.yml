services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    volumes:
      - scanner-data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  scanner-data:
